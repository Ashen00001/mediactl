[package]
name = "mediactl"
version = "0.1.0"
edition = "2021"
description = "Read-only, shadow-mode controller for a self-hosted media stack"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tracing = "0.1"
tracing-subscriber = "0.3"
